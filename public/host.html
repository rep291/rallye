<script>

let ovKey = '', evalView = false, evalSeen = false, evalTimer = null;
function showEval(on) { clearTimeout(evalTimer); evalTimer = null; evalSeen = true; evalView = on; ovKey = ''; renderOverlay(S); }
function evalHTML(s, print) {

  if (pd.type === 'action') {
    card.innerHTML = `<div class="who" style="margin:0 0 10px">${Figuren.icon(p.figure, p.color, 30)} Aktionskarte für <b>${esc(p.name)}</b></div><div class="fkwrap">${Fragekarte.htmlAction(pd.card)}</div>`;
    scaleCard(card);
  } else {
    const L = i => String.fromCharCode(97 + i) + ')';
    const signed = n => n > 0 ? '+' + n : String(n), range = Math.min(5, s.judgeRange || 5);
    const counts = pd.groupCounts, tot = counts ? counts.reduce((a, b) => a + b, 0) : 0;
    const dist = counts ? `<div class="votedist"><div class="vdtitle">Spielerantwort <b>${pd.answer != null ? L(pd.answer) : '–'}</b> · Gruppe (${tot} Stimme${tot === 1 ? '' : 'n'}):</div>${counts.map((c, i) => `<div class="vdrow ${i === pd.answer ? 'mine' : ''}"><b>${L(i)}</b><span class="vdbar"><i style="width:${tot ? Math.round(c / tot * 100) : 0}%"></i></span><span>${c}${tot ? ' · ' + Math.round(c / tot * 100) + ' %' : ''}</span></div>`).join('')}</div>` : '';
    const stageTxt = s.paused ? '⏸ Spiel pausiert' : pd.stage === 'personal' ? `🔒 ${esc(p.name)} legt sich am Handy fest … (geheim)` : pd.stage === 'group' ? `🔒 Antwort festgelegt. Die Gruppe stimmt jetzt ab: <b>${pd.groupVoted}/${pd.groupTotal}</b> <button class="ghost small" onclick="emit('host:revealVotes')">Abstimmung beenden</button>` : 'Besprechen und bewerten (−' + range + ' bis +' + range + ' Felder):';
    const res = pd.resolved ? `${dist}<div class="res">Bewertung: <b>${signed(pd.delta || 0)} Felder</b></div>` : `<div class="who">${stageTxt}</div>${dist}${pd.stage === 'reveal' ? `<div class="judgebar">${Array.from({length:range*2+1},(_,i) => i-range).map(n => `<button class="${n < 0 ? 'bad' : n > 0 ? 'ok' : 'zero'}" data-delta="${n}" ${s.paused ? 'disabled' : ''} onclick="emit('host:judge',${n})">${signed(n)}</button>`).join('')}</div><div class="ctrl judgequick"><button class="ok" ${s.paused ? 'disabled' : ''} onclick="emit('host:judge',true)">Richtig ${signed(s.quickRight ?? 2)}</button><button class="bad" ${s.paused ? 'disabled' : ''} onclick="emit('host:judge',false)">Falsch ${signed(s.quickWrong ?? 0)}</button></div>` : ''}`;
    card.innerHTML = `<div class="who" style="margin:0 0 10px">${Figuren.icon(p.figure, p.color, 30)} Fragekarte für <b>${esc(p.name)}</b></div><div class="fkwrap">${Fragekarte.html(pd.card, { chosen: pd.stage === 'reveal' || pd.resolved ? pd.answer : null, right: pd.card.correct })}</div>${res}`;
    scaleCard(card);
  }
}
// Einstellungen (Raum-bezogen), Raumuebersicht ohne fremde Namen, Spieler verwalten
function renamePlayer(id) { const p = S.players.find(p => p.id === id); if (!p) return; const name = prompt('Neuer Name:', p.name); if (name && name.trim()) emit('host:rename', { id, name }); }
function closeSettings() { $('settingsov').classList.remove('show'); }
function openSettings() {
  if (!S || !S.room) return; const st = S.room.settings;
  const ck = k => st[k] !== false ? 'checked' : '';
  $('settingsbody').innerHTML = `<p class="hint">Raum <b>${roomCode}</b> · Änderungen gelten nur hier. Bei laufenden Karten greifen Regeländerungen ab dem nächsten Zug.</p>
    <div class="settingsgrid">
     <label>Finanzpolizei: nach wie vielen Fehlversuchen frei? <small>0 = nur mit 6</small><input id="set_fp" type="number" min="0" max="20" value="${st.fpMaxTries ?? board.rules.finanzpolizei.maxTries ?? 0}"></label>
     <label class="check"><input id="set_exact" type="checkbox" ${(st.finishExact ?? board.rules.finishExact) ? 'checked' : ''}> Exakte Zahl fürs Ziel (sonst zurückprallen)</label>
     <label class="check"><input id="set_a" type="checkbox" ${ck('actionCards')}> Aktionskarten aktiv</label>
     <label class="check"><input id="set_q" type="checkbox" ${ck('questionCards')}> Fragekarten aktiv</label>
     <label>Zugzeit-Limit (Sekunden)<small>0 = aus, danach automatischer Wurf</small><input id="set_turn" type="number" min="0" max="600" value="${st.turnTimeSec || 0}"></label>
     <label>Fragezeit-Limit (Sekunden)<small>0 = aus; danach Schnellwahl Falsch</small><input id="set_question" type="number" min="0" max="600" value="${st.questionTimeSec ?? board.rules.questionTimeSec ?? 0}"></label>
     <label>Zeitlimit-Modus (Minuten)<small>0 = aus; bei Ablauf gewinnt, wer am weitesten ist</small><input id="set_game" type="number" min="0" max="240" value="${st.gameTimeMin || 0}" ${S.phase === 'playing' ? 'disabled title="Nur vor Rundenbeginn"' : ''}></label>
     <div class="packs"><b>Kartenpakete</b> <small>${S.phase === 'lobby' ? 'nur vor Rundenbeginn wählbar; keine Auswahl = alle Karten' : 'gesperrt – Runde läuft'}</small>${(S.packs || []).map(pk => `<label class="check"><input type="checkbox" class="packbox" value="${pk.id}" ${(st.packs || []).includes(pk.id) ? 'checked' : ''} ${S.phase === 'lobby' ? '' : 'disabled'}> ${esc(pk.name)}</label>`).join('')}</div>
     <label>Bewertungsbereich (max. ±5)<input id="set_range" type="number" min="1" max="5" value="${st.judgeRange || 5}"></label>
     <label>Schnellwahl Richtig / Falsch<div class="two"><input id="set_right" type="number" min="-5" max="5" value="${st.quickRight ?? 2}"><input id="set_wrong" type="number" min="-5" max="5" value="${st.quickWrong ?? 0}"></div></label>
     <label>Sound-Lautstärke <input id="set_vol" type="range" min="0" max="100" value="${Math.round(Effekte.volume * 100)}" oninput="Effekte.setVolume(this.value / 100)"></label>
     <button class="ghost" onclick="toggleMute()">🔊 Ton an/aus</button>
    </div><button class="ok" onclick="saveSettings()">Einstellungen speichern</button>
    <h3>Spieler verwalten</h3><div class="manageplayers">${S.players.map(p => `<div>${Figuren.icon(p.figure,p.color,34)}<b>${esc(p.name)}</b><span>${fieldLabel(p.pos,S)}</span><button class="ghost" onclick="renamePlayer('${p.id}');setTimeout(openSettings,200)">✎ Umbenennen</button><button class="bad" onclick="if(confirm('Spieler entfernen?')){emit('host:kick','${p.id}');setTimeout(openSettings,200)}">✕</button></div>`).join('')}</div>
    <h3>Räume auf diesem Server</h3><p class="hint">Pro Raum genau eine Spielleitung (mit eigenem Host-Token). Andere Gruppen sind nur als anonyme Übersicht sichtbar, nicht steuerbar.</p><div id="roomslist">Lädt …</div><button class="ghost" onclick="refreshRooms()">⟳ Aktualisieren</button><p><button class="bad" onclick="if(confirm('Diesen Raum schließen und alle trennen?')){closeSettings();emit('host:closeRoom')}">Diesen Raum schließen</button></p>`;
  $('settingsov').classList.add('show'); refreshRooms();
}
function saveSettings() { const n = id => +$(id).value; emit('host:settings', { fpMaxTries:n('set_fp'), finishExact:$('set_exact').checked, actionCards:$('set_a').checked, questionCards:$('set_q').checked, turnTimeSec:n('set_turn'), ...(S.phase !== 'playing' ? { gameTimeMin:n('set_game') } : {}), ...(S.phase === 'lobby' ? { packs:[...document.querySelectorAll('.packbox:checked')].map(x => x.value) } : {}), questionTimeSec:n('set_question'), judgeRange:n('set_range'), quickRight:n('set_right'), quickWrong:n('set_wrong') }); closeSettings(); toast('✓ Einstellungen für Raum ' + roomCode + ' gespeichert', '', 1800); }
function refreshRooms() { sock.emit('host:rooms', list => { if (!$('roomslist')) return; $('roomslist').innerHTML = `<table class="roomtable"><thead><tr><th>Raum</th><th>Status</th><th>Spieler</th><th>Host</th></tr></thead><tbody>${list.map(r => `<tr class="${r.mine?'mine':''}"><td><b>${r.code}</b>${r.mine?' · deiner':''}</td><td>${r.paused?'Pause':r.phase === 'lobby'?'Lobby':r.phase === 'playing'?'Spiel läuft':'Beendet'}</td><td>${r.players} (${r.connected} online)</td><td>${r.hostOnline?'verbunden':'offline'}</td></tr>`).join('')}</tbody></table>`; }); }
setInterval(() => { if (!S) return; const d = S.turnDeadline, t = $('countdown'); const g = S.gameDeadline ? S.gameDeadline - Date.now() : S.gameRemaining; const mm = ms => { const x = Math.max(0, Math.ceil(ms / 1000)); return Math.floor(x / 60) + ':' + String(x % 60).padStart(2, '0'); };
  if (t) t.innerHTML = (S.phase === 'playing' && g ? `<div class="gametime">⏳ ${mm(g)}</div>` : '') + (d && !S.paused && !S.busy ? '⏱ Zug: ' + Math.max(0, Math.ceil((d - Date.now()) / 1000)) + ' s' : ''); }, 500);
// Tastatur: F = Vollbild, M = Ton an/aus (Esc schliesst das Menue, siehe oben)
document.addEventListener('keydown', e => { if (e.target.closest('input,textarea')) return; if (e.key === 'f' || e.key === 'F') $('fsbtn').click(); if (e.key === 'm' || e.key === 'M') $('mutebtn').click(); });
</script></body></html>
